name: ai-news-daily

on:
  schedule:
    # 兜底：cron-job.org 挂了才有用。晚于 cron-job.org 5 分钟避免重复触发
    # cron-job.org 在 UTC 0:00 / 12:00 触发，这里 UTC 0:05 / 12:05 触发
    - cron: '5 0,12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        required: true
        default: 'morning'

concurrency:
  group: ai-news-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        uses: actions/download-artifact@v4
        with:
          name: ai-news-state
          path: .
        continue-on-error: true

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          MODE="morning"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            hour=$(date -u +%H)
            if [ "$hour" -ge 12 ]; then MODE="evening"; fi
          fi
          python main.py --mode "$MODE"

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-state
          path: state.json

      - name: Save digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-output
          path: output/
